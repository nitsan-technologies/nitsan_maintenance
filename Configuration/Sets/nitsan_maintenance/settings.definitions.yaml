categories:
  NitsanMaintenance:
    label: NitsanMaintenance Settings

  NitsanMaintenance.plugin:
    label: NitsanMaintenance Plugin (FE) Settings
    parent: NitsanMaintenance

  NitsanMaintenance.module:
    label: NitsanMaintenance Module (BE) Settings
    parent: NitsanMaintenance

settings:
  # Plugin (FE) — keys must match TypoScript constant paths (see setup.typoscript {$...})
  plugin.tx_nitsanmaintenance_mode.persistence.storagePid:
    label: Default Page ID (Plugin)
    category: NitsanMaintenance.plugin
    type: int
    default: 0

  plugin.tx_nitsanmaintenance_mode.settings.adminEmail:
    label: Admin Email
    category: NitsanMaintenance.plugin
    type: string
    default: ''

  # Module (BE)
  module.tx_nitsanmaintenance_maintenance.persistence.storagePid:
    label: Default Page ID (Module)
    category: NitsanMaintenance.module
    type: int
    default: 0